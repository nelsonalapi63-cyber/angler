# Builds ANGLER and publishes it to GitHub Pages.
# Runs on every push to main and every day at 05:05 UTC (00:05 Eastern in winter, 01:05 in summer; the boot bundle
# carries today AND tomorrow, so the site is never a day behind either way).
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 5 * * *'
  workflow_dispatch:

permissions:
  contents: write      # the daily run commits the regenerated schedule so past days stay frozen
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # optional: add these three repository secrets and every build also refreshes the answer bank the server scores with
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      BANK_TOKEN: ${{ secrets.BANK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright's Chromium (renders the per-day Open Graph images)
        run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Tests
        run: node --test tests/*.test.js
      - name: Build (freezes past days, regenerates the schedule, writes boot.js and dist/)
        run: |
          node build.js --dist
          node tools/make-icons.js --og-days
          cp -r icons dist/icons
      - name: Upload the answer bank to Supabase (so the server scores with the same bank the players see)
        if: env.SUPABASE_URL != '' && env.BANK_TOKEN != ''
        run: node tools/upload-bank.js
      - name: Commit the frozen schedule and data version
        if: github.event_name == 'schedule'
        run: |
          git config user.name "angler-bot"
          git config user.email "angler-bot@users.noreply.github.com"
          git add data/schedule.json data/version.json icons/og
          git diff --cached --quiet || git commit -m "chore: daily schedule freeze $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
